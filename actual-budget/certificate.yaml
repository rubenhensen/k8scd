# The TLS certificate the Gateway serves for this app (see httproute.yaml).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: actual-budget-tls
spec:
  secretName: actual-budget-tls
  dnsNames:
  - ynab.rubenhensen.nl
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: prod-cluster-issuer
  usages:
  - digital signature
  - key encipherment
