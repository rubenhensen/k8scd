apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-folder
spec:
  project: default
  source:
    repoURL: https://github.com/rubenhensen/k8scd.git
    targetRevision: HEAD
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    # From Argo CD 3.3 the ApplicationSet CRD is too big for client-side
    # apply's last-applied annotation.
    - ServerSideApply=true
    automated:
      selfHeal: true
