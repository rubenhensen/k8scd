apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bolletjestrui
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rubenhensen/k8scd.git
    targetRevision: HEAD
    path: bolletjestrui
  destination:
    server: https://kubernetes.default.svc
    namespace: bolletjestrui
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
