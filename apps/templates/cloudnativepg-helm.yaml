apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: cloudnative-pg
    repoURL: https://cloudnative-pg.github.io/charts
    targetRevision: 0.29.1
    helm:
      values: |
        config:
          data:
            # Swap the instance manager inside running pods on operator
            # upgrades instead of restarting them. Both clusters have a
            # single instance, so a restart means downtime.
            ENABLE_INSTANCE_MANAGER_INPLACE_UPDATES: "true"
        # Ride out dqlite stalls of up to ~40s instead of restarting when a
        # lease renewal takes over 10s (docs/upgrade-k8s-1.33.md).
        additionalArgs:
          - --leader-lease-duration=60
          - --leader-renew-deadline=40
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
