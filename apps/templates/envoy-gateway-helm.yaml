apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helm-envoy-gateway
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # No scheme, so Argo CD pulls the chart from the OCI registry.
    repoURL: docker.io/envoyproxy
    chart: gateway-helm
    # v1.9 supports Kubernetes 1.33 to 1.36
    targetRevision: 1.9.3
    helm:
      values: |
        config:
          envoyGateway:
            provider:
              kubernetes:
                # Ride out dqlite stalls of up to ~40s instead of restarting
                # when a lease renewal takes over 10s
                # (docs/upgrade-k8s-1.33.md).
                leaderElection:
                  leaseDuration: 60s
                  renewDeadline: 40s
                  retryPeriod: 5s
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    # The bundled Gateway API CRDs are too big for client-side apply.
    - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
