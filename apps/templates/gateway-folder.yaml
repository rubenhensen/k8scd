apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-folder
  namespace: argocd
  annotations:
    # Let the API server fill in Gateway API defaults before diffing, or
    # every defaulted field shows up as a difference.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rubenhensen/k8scd.git
    targetRevision: HEAD
    path: gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
