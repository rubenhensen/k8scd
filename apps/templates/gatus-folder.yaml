apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatus-folder
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rubenhensen/k8scd.git
    targetRevision: HEAD
    path: gatus
  destination:
    server: https://kubernetes.default.svc
    namespace: gatus
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      # Each config change generates a new gatus-config-<hash> ConfigMap;
      # prune removes the old one.
      prune: true
      selfHeal: true
