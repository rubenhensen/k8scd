apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helm-longhorn
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    syncOptions:
      - CreateNamespace=true 
    automated:
      prune: true
      selfHeal: true
  project: default
  sources:
    - chart: longhorn
      repoURL: https://charts.longhorn.io/
      targetRevision: 1.11.2 # Replace with the Longhorn version you'd like to install or upgrade to
      helm:
        values: |
          persistence:
            defaultClassReplicaCount: 1
          preUpgradeChecker:
            jobEnabled: false
          defaultSettings:
            # Move volumes to the new engine image after each Longhorn
            # upgrade, one at a time. At 0 they stayed behind on 1.7.1/1.7.2.
            concurrentAutomaticEngineUpgradePerNodeLimit: 1
        parameters:
          - name: csi.kubeletRootDir
            value: "/var/snap/microk8s/common/var/lib/kubelet"
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system