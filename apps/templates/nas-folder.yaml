apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nas
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rubenhensen/k8scd.git
    targetRevision: HEAD
    path: nas
  destination:
    server: https://kubernetes.default.svc
    namespace: nas
  syncPolicy:
    syncOptions:
    - CreateNamespace=true