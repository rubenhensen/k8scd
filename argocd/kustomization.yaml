apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd


# additional resources like the route, certificate and secrets.
resources:
- https://raw.githubusercontent.com/argoproj/argo-cd/refs/tags/v3.4.12/manifests/install.yaml
- certificate.yaml
- httproute.yaml
- oidc-secret.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: ReplicaSet
      name: argocd-notifications-controller
    path: overlays/argocd-notifications-controller-patch.yaml
  - path: overlays/argocd-cm.patch.yaml
  - path: overlays/argocd-rbac-cm.patch.yaml
  - path: overlays/argocd-cmd-params-cm.patch.yaml
  - path: overlays/patched-ca-bundle.patch.yaml