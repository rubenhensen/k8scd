apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  # TLS ends at the Gateway, so argocd-server serves plain HTTP. The Gateway
  # API has no simple way to trust argocd-server's self-signed cert.
  server.insecure: "true"
