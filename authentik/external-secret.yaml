# The Scouts Online connection (login.scouting.nl, "Beheerde websites"),
# mounted as files for blueprint-scouting.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scouts-online-client
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: scouts-online-client
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: kv/scouts-online
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: kv/scouts-online
        property: client_secret
