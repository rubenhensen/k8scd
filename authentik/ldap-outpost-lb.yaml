apiVersion: v1
kind: Service
metadata:
  name: ldap-outpost-external
  namespace: authentik
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: ak-outpost-ldap-outpost
  ports:
    - name: ldap
      port: 389
      targetPort: 3389
      protocol: TCP
    - name: ldaps
      port: 636
      targetPort: 6636
      protocol: TCP
