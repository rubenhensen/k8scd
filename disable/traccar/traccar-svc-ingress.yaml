---
# Service for Traccar
apiVersion: v1
kind: Service
metadata:
  name: traccar-osmand
  namespace: traccar
  labels:
    app.kubernetes.io/name: traccar
    app.kubernetes.io/instance: traccar
    app.kubernetes.io/version: '5.10'
spec:
  type: ClusterIP
  ports:
    - port: 5055
      targetPort: 5055
      protocol: TCP
      name: osmand
  selector:
    app.kubernetes.io/name: traccar
    app.kubernetes.io/instance: traccar
---
# Ingress for Traccar OsmAnd port
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traccar-osmand-ingress
  namespace: traccar
  labels:
    app.kubernetes.io/name: traccar
    app.kubernetes.io/instance: traccar
    app.kubernetes.io/version: '5.10'
  annotations:
    # You may want to add annotations based on your ingress controller
    cert-manager.io/cluster-issuer: prod-cluster-issuer
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/backend-protocol: "TCP"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: traccar-client.hensen.io  # Replace with your actual domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traccar-osmand
                port:
                  number: 5055
  # Uncomment and configure if you need TLS
  tls:
  - hosts:
    - traccar-client.hensen.io
    secretName: traccar-osmand-tls-secret