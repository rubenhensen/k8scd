apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: transip-credentials
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: transip-credentials
    creationPolicy: Owner
  data:
    - secretKey: private_key
      remoteRef:
        key: kv/transip
        property: private_key
    - secretKey: account_name
      remoteRef:
        key: kv/transip
        property: account_name
