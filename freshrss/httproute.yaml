apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: freshrss
spec:
  parentRefs:
  - name: homelab
    namespace: envoy-gateway-system
    sectionName: https-rss
  hostnames:
  - rss.rubenhensen.nl
  rules:
  - backendRefs:
    - name: freshrss
      port: 8080
    # No limit on the whole request, as with nginx. Envoy's default of 15s
    # cuts off uploads and long-lived connections.
    timeouts:
      request: 0s
---
# Lets the Gateway serve the certificate cert-manager keeps in this namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: gateway-tls
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: envoy-gateway-system
  to:
  - group: ""
    kind: Secret
    name: letsencrypt-prod
