# The single entry point for all HTTP(S) traffic. Each app adds an HTTPS
# listener for its hostname here and an HTTPRoute in its own namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
  # One HTTPS listener per hostname, each limited to its app's namespace.
  # The certificates stay in the app namespaces (ReferenceGrant there).
  - name: https-s2
    protocol: HTTPS
    port: 443
    hostname: s2.rubenhensen.nl
    tls:
      certificateRefs:
      - name: letsencrypt-prod
        namespace: gatus
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            kubernetes.io/metadata.name: gatus
  - name: https-ynab
    protocol: HTTPS
    port: 443
    hostname: ynab.rubenhensen.nl
    tls:
      certificateRefs:
      - name: actual-budget-tls
        namespace: actual-budget
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            kubernetes.io/metadata.name: actual-budget
  - name: https-authentik
    protocol: HTTPS
    port: 443
    hostname: authentik.rubenhensen.nl
    tls:
      certificateRefs:
