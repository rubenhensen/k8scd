apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-ntfy
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: gatus-ntfy
    creationPolicy: Owner
  data:
    - secretKey: NTFY_TOKEN
      remoteRef:
        key: kv/ntfy
        property: gatus_token
