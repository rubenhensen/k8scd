apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gatus

resources:
  - external-secret.yaml
  - data-persistentvolumeclaim.yaml
  - gatus-deployment.yaml
  - gatus-service.yaml
  - certificate.yaml
  - httproute.yaml
  - networkpolicy.yaml
  - backup-check.yaml

configMapGenerator:
  - name: gatus-config
    files:
      - config.yaml
