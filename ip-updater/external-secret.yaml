apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ip-updater-ssh-key
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: ip-updater-ssh-key
    creationPolicy: Owner
  data:
    - secretKey: private_key
      remoteRef:
        key: kv/ip-updater
        property: ssh_private_key
