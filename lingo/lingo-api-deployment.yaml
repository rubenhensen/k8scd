apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: lingo-api
  name: lingo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lingo-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: lingo-api
    spec:
      containers:
        - image: ghcr.io/rubenhensen/lingo-api:master-4404fe5
          name: lingo-api
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      restartPolicy: Always
