apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lingo-api-ingress
  annotations:
    cert-manager.io/cluster-issuer: prod-cluster-issuer
    nginx.ingress.kubernetes.io/ssl-passthrough: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - host: lingo.hensen.io
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: lingo-api
            port:
              number: 8000
  - host: lingo.rubenhensen.nl
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: lingo-api
            port:
              number: 8000
  tls:
    - secretName: letsencrypt-prod
      hosts:
        - lingo.hensen.io
        - lingo.rubenhensen.nl
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lingo-frontend-ingress
  annotations:
    cert-manager.io/cluster-issuer: prod-cluster-issuer
    nginx.ingress.kubernetes.io/ssl-passthrough: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: lingo.hensen.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lingo-frontend
            port:
              number: 8001
  - host: lingo.rubenhensen.nl
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lingo-frontend
            port:
              number: 8001
  tls:
    - secretName: letsencrypt-prod
      hosts:
        - lingo.hensen.io
        - lingo.rubenhensen.nl
