apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mariadb-operator
  namespace: argocd
  labels:
    app.kubernetes.io/instance: mariadb-operator-install
spec:
  destination:
    namespace: mariadb-system
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: mariadb-operator
    repoURL: https://mariadb-operator.github.io/mariadb-operator
    targetRevision: 26.10.2
    helm:
      values: |
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 128Mi
        metrics:
          enabled: true
          serviceMonitor:
            enabled: false
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          serviceMonitor:
            enabled: false
        certController:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          serviceMonitor:
            enabled: false
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
