apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wordpress
spec:
  parentRefs:
  - name: homelab
    namespace: envoy-gateway-system
    sectionName: https-scoutingmbg
  - name: homelab
    namespace: envoy-gateway-system
    sectionName: https-www-scoutingmbg
  hostnames:
  - scoutingmbg.nl
  - www.scoutingmbg.nl
  rules:
  - backendRefs:
    - name: mbgwp-official-helm-wordpress
      port: 80
    # No limit on the whole request, as with nginx. Envoy's default of 15s
    # cuts off uploads and long-lived connections.
    timeouts:
      request: 0s
---
# Lets the Gateway serve the certificate cert-manager keeps in this namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: gateway-tls
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: envoy-gateway-system
  to:
  - group: ""
    kind: Secret
    name: scoutingmbg-nl-tls
