apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ntfy-auth
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: ntfy-auth
    creationPolicy: Owner
  data:
    - secretKey: NTFY_AUTH_USERS
      remoteRef:
        key: kv/ntfy
        property: auth_users
    - secretKey: NTFY_AUTH_TOKENS
      remoteRef:
        key: kv/ntfy
        property: auth_tokens
