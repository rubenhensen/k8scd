apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hensenio-smtp-secrets
  namespace: blog
spec:
  refreshInterval: "15m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ghost-es
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: kv/ghost
        property: ghostmsqlpw
    - secretKey: ghost-password
      remoteRef:
        key: kv/ghost
        property: ghostpw