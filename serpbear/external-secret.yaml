apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: serpbear-secrets
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: serpbear-secrets
    creationPolicy: Owner
  data:
    - secretKey: user
      remoteRef:
        key: kv/serpbear
        property: user
    - secretKey: password
      remoteRef:
        key: kv/serpbear
        property: password
    - secretKey: secret
      remoteRef:
        key: kv/serpbear
        property: secret
    - secretKey: apikey
      remoteRef:
        key: kv/serpbear
        property: apikey
