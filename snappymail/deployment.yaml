apiVersion: apps/v1
kind: Deployment
metadata:
  name: snappymail
  labels:
    app: snappymail
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: snappymail
  template:
    metadata:
      labels:
        app: snappymail
    spec:
      containers:
        - name: snappymail
          image: djmaze/snappymail:latest
          ports:
            - containerPort: 8888
              protocol: TCP
          env:
            - name: TZ
              value: Europe/Amsterdam
          volumeMounts:
            - name: snappymail-data
              mountPath: /var/lib/snappymail
          livenessProbe:
            httpGet:
              path: /
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: snappymail-data
          persistentVolumeClaim:
            claimName: snappymail-data
