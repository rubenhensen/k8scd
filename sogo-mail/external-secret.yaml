apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sogo-mail-postgres-credentials
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: sogo-mail-postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: kv/sogo-mail
        property: postgres_user
    - secretKey: password
      remoteRef:
        key: kv/sogo-mail
        property: postgres_pw
