apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sogo-postgres-credentials
  namespace: sogo
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: sogo-postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: kv/sogo
        property: postgres_pw
