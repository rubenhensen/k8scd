apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sogo-postgres-credentials
  namespace: sogo
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: sogo-postgres-credentials
    creationPolicy: Owner
    template:
      data:
        username: "sogo"
        password: "{{ .postgres_pw }}"
  data:
    - secretKey: postgres_pw
      remoteRef:
        key: kv/sogo
        property: postgres_pw
