
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sogo-postgres-credentials
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: sogo-postgres-credentials
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: kv/sogo
      property: postgres_user
  - secretKey: password
    remoteRef:
      key: kv/sogo
      property: postgres_pw

