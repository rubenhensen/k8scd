image:
  repository: ghcr.io/sonroyaalmerol/docker-sogo
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: prod-cluster-issuer
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  host: post.hensen.io
  tls:
    secretName: sogo-tls

persistence:
  enabled: true
  storageClass: longhorn
  size: 5Gi
  accessMode: ReadWriteOnce

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

config:
  timezone: Europe/Amsterdam
  language: en
  domain: hensen.io
  adminUser: admin@hensen.io
  workersCount: 3
  listenQueueSize: 5

  modules:
    mail: true
    calendar: true
    contacts: true
    tasks: true

  mail:
    imapServer: stalwart.stalwart.svc.cluster.local
    imapPort: 993
    imapEncryption: tls
    smtpServer: stalwart.stalwart.svc.cluster.local
    smtpPort: 587
    smtpEncryption: tls
    authenticationType: IMAP

  calendar:
    firstDayOfWeek: 1  # Monday
    dayStartTime: 8
    dayEndTime: 18
    timeFormat: "%H:%M"

  webui:
    pageTitle: "Hensen Webmail"
    mailReloadInterval: 300
    calendarReloadInterval: 300

postgresql:
  enabled: true
  instances: 1
  storage:
    storageClass: longhorn
    size: 10Gi
  database: sogo
  username: sogo
  sharedBuffers: 256MB
  maxConnections: 100

externalSecret:
  enabled: true
  secretStore: vault-backend
  vaultPath: kv/sogo
  refreshInterval: 15m
