apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "stalwart.fullname" . }}-smtp2go
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
spec:
  refreshInterval: "15m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ include "stalwart.fullname" . }}-smtp2go
    creationPolicy: Owner
  data:
  - secretKey: user
    remoteRef:
      key: kv/smtp2go
      property: user
  - secretKey: pw
    remoteRef:
      key: kv/smtp2go
      property: pw
