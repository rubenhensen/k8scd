# Volume policy for the backup schedules. emptyDir volumes hold nothing
# worth keeping, and backing them up fails when the pod is gone before its
# volume is read, as happens with Velero's own repository maintenance jobs.
# PVCs in Longhorn's no-backup group (caches, such as immich's ML models)
# are skipped too.
apiVersion: v1
kind: ConfigMap
metadata:
  name: skip-emptydir-policy
data:
  policy.yaml: |
    version: v1
    volumePolicies:
    - conditions:
        volumeTypes:
        - emptyDir
      action:
        type: skip
    - conditions:
        pvcLabels:
          recurring-job-group.longhorn.io/no-backup: enabled
      action:
        type: skip
