apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-helm
  namespace: argocd
spec:
  project: default
  source:
    chart: velero
    repoURL: https://vmware-tanzu.github.io/helm-charts
    targetRevision: 10.1.3
    helm:
      values: |
        # Velero builds its repository maintenance jobs from a Deployment
        # named "velero". Under the default name (velero-helm) every
        # maintenance run failed and the kopia repos on the NAS were never
        # cleaned up.
        fullnameOverride: velero
        # The CRD upgrade hook pulls docker.io/bitnami/kubectl, which Bitnami
        # has removed, so every sync hangs on it. Not needed anyway: Argo CD
        # applies the chart's crds/ directory on every sync, which is how the
        # 1.16 CRDs got in.
        upgradeCRDs: false
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.12.2
            volumeMounts:
              - mountPath: /target
                name: plugins
        configuration:
          backupStorageLocation:
            - name: default
              bucket: velero-backups
              provider: aws
              config:
                region: minio
                s3ForcePathStyle: true
                s3Url: http://192.168.1.99:9000
                insecureSkipTLSVerify: "true"
          volumeSnapshotLocation:
            - name: default
              provider: aws
              config:
                region: minio
          features: EnableCSI
        credentials:
          # Use existing secret created by External Secrets Operator
          # existingSecret: velero-minio-credentials
          # extraEnvVars:
          # AWS_SHARED_CREDENTIALS_FILE: /credentials/cloud
          existingSecret: cloud-credentials
        deployNodeAgent: true
        nodeAgent:
          containerSecurityContext:
            privileged: true
        # 512Mi got the server OOMKilled 314 times, including halfway
        # through a backup of ~14.7k items.
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 2Gi
        
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      selfHeal: true