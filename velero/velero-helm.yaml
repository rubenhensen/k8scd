apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-helm
  namespace: argocd
spec:
  project: default
  source:
    chart: velero
    repoURL: https://vmware-tanzu.github.io/helm-charts
    targetRevision: 12.2.1
    helm:
      values: |
        # Velero builds its repository maintenance jobs from a Deployment
        # named "velero". Under the default name (velero-helm) every
        # maintenance run failed and the kopia repos on the NAS were never
        # cleaned up.
        fullnameOverride: velero
        # No CRD upgrade hook: Argo CD applies the chart's crds/ directory on
        # every sync. (Before chart 12 the hook also pulled
        # docker.io/bitnami/kubectl, which Bitnami removed, and hung.)
        upgradeCRDs: false
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.14.4
            volumeMounts:
              - mountPath: /target
                name: plugins
        configuration:
          backupStorageLocation:
            - name: default
              bucket: velero-backups
              provider: aws
              config:
                region: minio
                s3ForcePathStyle: true
                s3Url: http://192.168.1.99:9000
                insecureSkipTLSVerify: "true"
          volumeSnapshotLocation:
            - name: default
              provider: aws
              config:
                region: minio
          features: EnableCSI
          # Kopia maintenance ran every hour for each of the 15 repositories,
          # and once a day as a full run of several minutes that writes its
          # cache to the node's only SSD, which stalls dqlite and makes
          # controllers lose their leases (docs/upgrade-k8s-1.33.md). Daily
          # and throttled instead. Existing BackupRepositories keep their own
          # maintenanceFrequency; they were patched to 24h by hand.
          defaultRepoMaintainFrequency: 24h
          repositoryMaintenanceJob:
            repositoryConfigData:
              global:
                keepLatestMaintenanceJobs: 3
                podResources:
                  cpuRequest: 100m
                  cpuLimit: 500m
                  memoryRequest: 256Mi
                  memoryLimit: 2Gi
        credentials:
          # Use existing secret created by External Secrets Operator
          # existingSecret: velero-minio-credentials
          # extraEnvVars:
          # AWS_SHARED_CREDENTIALS_FILE: /credentials/cloud
          existingSecret: cloud-credentials
        deployNodeAgent: true
        nodeAgent:
          containerSecurityContext:
            privileged: true
        # 512Mi got the server OOMKilled 314 times, including halfway
        # through a backup of ~14.7k items.
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 2Gi
        
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      selfHeal: true