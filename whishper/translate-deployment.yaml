apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: translate
  name: translate
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: translate
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: translate
    spec:
      containers:
        - env:
            - name: DB_PASS
              valueFrom:
                configMapKeyRef:
                  key: DB_PASS
                  name: env
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  key: DB_USER
                  name: env
            - name: LT_DISABLE_WEB_UI
              value: "true"
            - name: LT_LOAD_ONLY
              valueFrom:
                configMapKeyRef:
                  key: LT_LOAD_ONLY
                  name: env
            - name: LT_UPDATE_MODELS
              value: "true"
            - name: WHISHPER_HOST
              valueFrom:
                configMapKeyRef:
                  key: WHISHPER_HOST
                  name: env
            - name: WHISPER_MODELS
              valueFrom:
                configMapKeyRef:
                  key: WHISPER_MODELS
                  name: env
          image: libretranslate/libretranslate:latest
          livenessProbe:
            exec:
              command:
                - ./venv/bin/python scripts/healthcheck.py
            failureThreshold: 5
            periodSeconds: 2
            timeoutSeconds: 3
          name: whisper-libretranslate
          ports:
            - containerPort: 5000
              protocol: TCP
          tty: true
          securityContext:
            runAsUser: 1032
            runAsGroup: 1032
          volumeMounts:
            - mountPath: /home/libretranslate/.local/share
              name: translate-claim0
            - mountPath: /home/libretranslate/.local/cache
              name: translate-claim1
      restartPolicy: Always
      volumes:
        - name: translate-claim0
          persistentVolumeClaim:
            claimName: translate-claim0
        - name: translate-claim1
          persistentVolumeClaim:
            claimName: translate-claim1
