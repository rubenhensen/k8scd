apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: whishper
  name: whishper
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: whishper
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: whishper
    spec:
      containers:
        - env:
            - name: CPU_THREADS
              value: "4"
            - name: DB_PASS
              valueFrom:
                configMapKeyRef:
                  key: DB_PASS
                  name: env
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  key: DB_USER
                  name: env
            - name: LT_LOAD_ONLY
              valueFrom:
                configMapKeyRef:
                  key: LT_LOAD_ONLY
                  name: env
            - name: PUBLIC_API_HOST
            - name: PUBLIC_INTERNAL_API_HOST
              value: http://0.0.0.0:80
            - name: PUBLIC_TRANSLATION_API_HOST
            - name: PUBLIC_WHISHPER_PROFILE
              value: cpu
            - name: UPLOAD_DIR
              value: /app/uploads
            - name: WHISHPER_HOST
              valueFrom:
                configMapKeyRef:
                  key: WHISHPER_HOST
                  name: env
            - name: WHISPER_MODELS
              valueFrom:
                configMapKeyRef:
                  key: WHISPER_MODELS
                  name: env
            - name: WHISPER_MODELS_DIR
              value: /app/models
          image: pluja/whishper:latest
          name: whishper
          ports:
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - mountPath: /app/uploads
              name: whishper-claim0
            - mountPath: /var/log/whishper
              name: whishper-claim1
      restartPolicy: Always
      volumes:
        - name: whishper-claim0
          persistentVolumeClaim:
            claimName: whishper-claim0
        - name: whishper-claim1
          persistentVolumeClaim:
            claimName: whishper-claim1
